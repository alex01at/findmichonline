name: Deploy to Webhosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Remove files that must not be uploaded
        run: rm -rf .git .github

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # The host uses a self-signed FTPS certificate, so certificate
      # verification is intentionally disabled here (verified manually
      # that this host requires ftp:ssl-force with a self-signed cert).
      # .env is excluded from both upload and delete so the live
      # database/Stripe credentials on the server are never touched.
      # Credentials are passed via env vars (not interpolated directly
      # into the script) so special characters like "$" in the password
      # are not misread as shell variable references.
      - name: Deploy over FTPS
        timeout-minutes: 5
        env:
          LFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          LFTP_HOST: ${{ secrets.FTP_SERVER }}
          LFTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$LFTP_USER,$LFTP_PASS" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            mirror -R --delete --verbose \
              --exclude-glob .env \
              --exclude-glob .git* \
              --exclude-glob .github* \
              ./ ./ ;
            bye
          " "ftp://$LFTP_HOST:21/$LFTP_DIR"
