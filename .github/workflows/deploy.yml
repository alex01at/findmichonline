name: Deploy to Webhosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # The host presents a self-signed FTPS certificate, so certificate
      # verification is intentionally disabled in deploy_ftps.py (verified
      # manually against the live host that this is required). The script
      # skips .git, .github and .env on its own, so the live server's
      # database/Stripe credentials are never touched by a deploy.
      #
      # The very first deploy uploads the whole tree (~1000 files) at a
      # throttled pace (verified necessary against this host's firewall)
      # and can take up to ~30 minutes. Every deploy after that only
      # uploads files that actually changed and finishes in well under a
      # minute, since deploy_ftps.py skips remote files whose size
      # already matches.
      - name: Deploy over FTPS
        timeout-minutes: 40
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: python3 .github/scripts/deploy_ftps.py
